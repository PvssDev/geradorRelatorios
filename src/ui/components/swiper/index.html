<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./static/swiper-bundle.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .carousel-wrapper {
      position: relative;
      width: 100%;
      max-width: 860px;
      padding: 10px 0 32px 0;
    }

    .swiper {
      width: 100%;
      padding-top: 14px;
      padding-bottom: 28px;
      overflow: visible !important;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%);
      mask-image: linear-gradient(to right, transparent 0%, black 12%, black 88%, transparent 100%);
    }

    /* Fix: Força o hit-testing correto em efeito coverflow 3D.
       Sem isto, o translate3d(depth) faz cliques nos slides adjacentes
       serem interceptados pelo slide ativo na camada 3D do navegador. */
    .swiper-wrapper {
      pointer-events: none;
    }

    .swiper-slide {
      background-position: center;
      background-size: cover;
      width: 380px;
      max-width: 78vw;
      height: 270px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.08);
      transition: opacity 0.7s cubic-bezier(0.25, 1, 0.5, 1), filter 0.7s cubic-bezier(0.25, 1, 0.5, 1), transform 0.7s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.7s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.7s cubic-bezier(0.25, 1, 0.5, 1);
      border: 2px solid rgba(255, 255, 255, 0.6);
      cursor: grab;
      background-color: #1e293b;
      pointer-events: auto;
    }

    .swiper-slide:not(.swiper-slide-active) {
      cursor: pointer !important;
      opacity: 0.52;
      filter: blur(0.4px) grayscale(15%);
    }

    .swiper-slide:not(.swiper-slide-active):hover {
      opacity: 0.82;
      filter: none;
    }

    .swiper-slide:active {
      cursor: grabbing;
    }

    .swiper-slide-active {
      opacity: 1;
      filter: none;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.22), 0 4px 12px rgba(0, 0, 0, 0.1);
      border-color: #3b82f6;
    }

    .swiper-slide-active.is-nc {
      border-color: #ef4444 !important;
      box-shadow: 0 16px 36px rgba(239, 68, 68, 0.2), 0 4px 12px rgba(0, 0, 0, 0.1);
    }

    .swiper-slide-active.is-finished-border {
      border-color: #10b981 !important;
      box-shadow: 0 16px 36px rgba(16, 185, 129, 0.2), 0 4px 12px rgba(0, 0, 0, 0.1);
    }

    .slide-img-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background-color: #0f172a;
    }

    .slide-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      transition: transform 0.4s ease;
    }

    .swiper-slide-active:hover .slide-img {
      transform: scale(1.03);
    }

    /* Overlay com Gradiente para a Legenda */
    .slide-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px 14px 10px 14px;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.88) 0%, rgba(15, 23, 42, 0.5) 60%, transparent 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 3px;
      pointer-events: none;
    }

    .slide-title {
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      letter-spacing: 0.2px;
    }

    .hide-labels .slide-overlay {
      display: none !important;
    }
    
    .carousel-wrapper.is-vertical {
      height: 400px;
    }
    
    .carousel-wrapper.is-vertical .swiper {
      height: 100%;
      padding-top: 0;
      padding-bottom: 0;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 88%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 88%, transparent 100%);
    }

    .carousel-wrapper.is-vertical .swiper-slide {
      margin-left: auto !important;
      margin-right: auto !important;
    }

    .carousel-wrapper.is-vertical .swiper-button-prev,
    .carousel-wrapper.is-vertical .swiper-button-next {
      left: 50%;
      margin-left: -20px;
      margin-top: 0;
      transform: rotate(90deg);
      z-index: 20;
      opacity: 0.35;
    }

    .carousel-wrapper.is-vertical .swiper-button-prev:hover,
    .carousel-wrapper.is-vertical .swiper-button-next:hover {
      transform: rotate(90deg) scale(1.1);
      opacity: 1;
    }

    .carousel-wrapper.is-vertical .swiper-button-prev {
      top: 5px;
      right: auto;
    }

    .carousel-wrapper.is-vertical .swiper-button-next {
      bottom: 25px;
      top: auto;
      right: auto;
    }

    .slide-badge-nc {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(239, 68, 68, 0.85); /* Vermelho translúcido suave */
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      z-index: 10;
      letter-spacing: 0.2px;
    }

    .slide-badge-nc.is-finished {
      background: rgba(16, 185, 129, 0.85); /* Verde esmeralda suave */
    }

    .slide-badge-counter {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 20px;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Custom Navigation Buttons */
    .swiper-button-prev,
    .swiper-button-next {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 50%;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
      color: #1e293b;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .swiper-button-prev:after,
    .swiper-button-next:after {
      font-size: 16px;
      font-weight: 800;
    }

    .swiper-button-prev:hover,
    .swiper-button-next:hover {
      background: #ffffff;
      transform: scale(1.1);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
      color: #2563eb;
    }

    .swiper-button-prev {
      left: 10px;
    }

    .swiper-button-next {
      right: 10px;
    }

    /* Custom Pagination Bullets (renderizadas manualmente — ver renderDots) */
    .swiper-pagination.custom-dots {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      z-index: 100;
      touch-action: none; /* Arraste (scrub) na barra de paginação */
    }

    .carousel-wrapper:not(.is-vertical) .swiper-pagination.custom-dots {
      left: 0;
      right: 0;
      bottom: 0;
      top: auto;
      flex-direction: row;
      padding: 8px 0;
      cursor: ew-resize;
    }

    .carousel-wrapper.is-vertical .swiper-pagination.custom-dots {
      top: 50%;
      right: 5px;
      left: auto;
      bottom: auto;
      transform: translateY(-50%);
      flex-direction: column;
      padding: 12px 10px 12px 20px; /* Aumenta a área de contato invisível para o mousewheel/arraste */
      cursor: ns-resize;
    }

    .swiper-pagination.is-scrubbing,
    .swiper-pagination.is-scrubbing .swiper-pagination-bullet {
      cursor: grabbing !important;
    }

    .swiper-pagination-bullet {
      display: inline-block;
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      margin: 0 !important;
      border-radius: 50%;
      background: #94a3b8;
      opacity: 0.45;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .swiper-pagination-bullet.is-small {
      transform: scale(0.75);
      opacity: 0.35;
    }

    .swiper-pagination-bullet.is-tiny {
      transform: scale(0.5);
      opacity: 0.25;
    }

    .swiper-pagination-bullet-active {
      width: 22px;
      height: 7px;
      border-radius: 4px;
      background: #3b82f6;
      opacity: 1;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.5);
    }
    
    /* Elegant vertical pill for vertical mode */
    .carousel-wrapper.is-vertical .swiper-pagination-bullet-active {
      width: 7px !important;
      height: 22px !important;
    }

    /* Dark Mode Adjustments */
    @media (prefers-color-scheme: dark) {
      .swiper-slide {
        border-color: rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      }

      .swiper-button-prev,
      .swiper-button-next {
        background: rgba(30, 41, 59, 0.85);
        color: #f1f5f9;
        border-color: rgba(255, 255, 255, 0.12);
      }

      .swiper-button-prev:hover,
      .swiper-button-next:hover {
        background: #334155;
        color: #60a5fa;
      }
    }
  </style>
</head>

<body>
  <div class="carousel-wrapper" id="carouselWrapper">
    <div class="swiper" id="mySwiper">
      <div class="swiper-wrapper" id="swiperSlidesContainer">
        <!-- Slides gerados dinamicamente via Streamlit -->
      </div>
    </div>
    <!-- Botões de navegação (fora do swiper para não serem apagados pela máscara) -->
    <div class="swiper-button-prev" title="Foto anterior"></div>
    <div class="swiper-button-next" title="Próxima foto"></div>
    <!-- Paginação moderna -->
    <div class="swiper-pagination custom-dots" id="customDots"></div>
  </div>

  <script src="./static/swiper-bundle.min.js"></script>
  <script>
    // Bridge de comunicação nativo do Streamlit Component
    const Streamlit = {
      setComponentReady: function () {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:componentReady",
          apiVersion: 1
        }, "*");
      },
      setFrameHeight: function (height) {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:setFrameHeight",
          height: height
        }, "*");
      },
      setComponentValue: function (value) {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:setComponentValue",
          value: value
        }, "*");
      }
    };

    let swiperInstance = null;
    let currentPhotosHash = "";
    let isInternalUpdate = false;
    let lastReportedIndex = -1;
    let isDestroying = false;
    let isScrubbing = false;
    let photoCount = 0;   // quantidade de fotos reais
    let slideCount = 0;   // quantidade de slides renderizados (fotos reais + cópias do loop)

    // Mínimo de slides para o loop do coverflow sempre ter fotos dos dois lados
    const MIN_LOOP_SLIDES = 12;

    /** Índice do slide (incluindo cópias) atualmente centralizado. */
    function getSlideIndex() {
      if (!swiperInstance) return 0;
      return typeof swiperInstance.realIndex === "number" ? swiperInstance.realIndex : swiperInstance.activeIndex;
    }

    /** Índice da foto real (0..photoCount-1) atualmente centralizada. */
    function getRealIndex() {
      if (!photoCount) return 0;
      return ((getSlideIndex() % photoCount) + photoCount) % photoCount;
    }

    /** Navega até a foto real pelo caminho mais curto (considerando o loop). */
    function goToPhoto(photoIdx, speed) {
      if (!swiperInstance || !photoCount) return;
      const cur = getSlideIndex();
      let best = photoIdx;
      let bestDist = Infinity;
      for (let k = photoIdx; k < slideCount; k += photoCount) {
        const diff = Math.abs(k - cur);
        const dist = Math.min(diff, slideCount - diff);
        if (dist < bestDist) { bestDist = dist; best = k; }
      }
      if (best !== cur) swiperInstance.slideToLoop(best, speed);
    }

    function reportActiveIndex() {
      if (!swiperInstance || isDestroying) return;
      const newIndex = getRealIndex();
      if (newIndex !== lastReportedIndex) {
        lastReportedIndex = newIndex;
        Streamlit.setComponentValue(newIndex);
      }
    }

    /**
     * Renderiza as bolinhas de paginação representando apenas as fotos reais.
     * Mostra uma janela circular de até 7 bolinhas ao redor da ativa,
     * reforçando a sensação de carrossel infinito.
     */
    function renderDots() {
      const dotsEl = document.getElementById("customDots");
      if (!dotsEl) return;
      if (photoCount <= 1) { dotsEl.innerHTML = ""; return; }

      const active = getRealIndex();
      const half = Math.min(3, Math.floor((photoCount - 1) / 2));
      const offsets = [];
      for (let o = -half; o <= half; o++) offsets.push(o);
      // Número par de fotos (≤ 7): inclui a bolinha restante à direita/abaixo
      if (photoCount <= 7 && offsets.length < photoCount) offsets.push(half + 1);

      dotsEl.innerHTML = offsets.map((o) => {
        const idx = ((active + o) % photoCount + photoCount) % photoCount;
        const dist = Math.abs(o);
        let cls = "swiper-pagination-bullet";
        if (dist === 0) cls += " swiper-pagination-bullet-active";
        else if (photoCount > 7 && dist === 2) cls += " is-small";
        else if (photoCount > 7 && dist >= 3) cls += " is-tiny";
        return `<span class="${cls}" data-idx="${idx}" title="Foto ${idx + 1}"></span>`;
      }).join("");
    }

    /**
     * Permite arrastar a barra de paginação (bolinhas) para trocar de foto.
     * Vertical: arrastar para baixo avança / para cima volta.
     * Horizontal: arrastar para a direita avança / para a esquerda volta.
     * Configurado uma única vez, pois o elemento de paginação fica fora do
     * #mySwiper e sobrevive às recriações do Swiper.
     */
    function setupPaginationScrub() {
      const paginationEl = document.querySelector("#carouselWrapper .swiper-pagination");
      if (!paginationEl || paginationEl.dataset.scrubReady) return;
      paginationEl.dataset.scrubReady = "1";

      const STEP_PX = 16; // distância de arraste necessária para trocar 1 foto
      let lastPos = 0;
      let accumulated = 0;
      let moved = false;
      let suppressClick = false;
      let activePointer = null;

      const isVertical = () =>
        document.getElementById("carouselWrapper").classList.contains("is-vertical");
      const getPos = (e) => (isVertical() ? e.clientY : e.clientX);

      paginationEl.addEventListener("pointerdown", (e) => {
        if (!swiperInstance || (e.pointerType === "mouse" && e.button !== 0)) return;
        activePointer = e.pointerId;
        isScrubbing = true;
        moved = false;
        accumulated = 0;
        lastPos = getPos(e);
        paginationEl.classList.add("is-scrubbing");
        e.preventDefault();
      });

      // Move/solta na janela inteira: o arraste continua mesmo saindo da barra
      window.addEventListener("pointermove", (e) => {
        if (!isScrubbing || e.pointerId !== activePointer || !swiperInstance) return;
        const pos = getPos(e);
        accumulated += pos - lastPos;
        lastPos = pos;

        // Sem final: o loop/rewind do Swiper leva da última para a primeira (e vice-versa)
        while (accumulated >= STEP_PX) {
          accumulated -= STEP_PX;
          swiperInstance.slideNext(180); moved = true;
        }
        while (accumulated <= -STEP_PX) {
          accumulated += STEP_PX;
          swiperInstance.slidePrev(180); moved = true;
        }
        e.preventDefault();
      });

      const endScrub = (e) => {
        if (!isScrubbing || (e && e.pointerId !== activePointer)) return;
        isScrubbing = false;
        activePointer = null;
        paginationEl.classList.remove("is-scrubbing");
        if (moved) {
          // Evita que o "click" do fim do arraste acione o clique na bolinha
          suppressClick = true;
          setTimeout(() => { suppressClick = false; }, 0);
        }
        // Reporta apenas o índice final ao Streamlit (um único rerun)
        reportActiveIndex();
      };

      window.addEventListener("pointerup", endScrub);
      window.addEventListener("pointercancel", endScrub);

      paginationEl.addEventListener("click", (e) => {
        if (suppressClick) {
          e.stopPropagation();
          e.preventDefault();
          suppressClick = false;
        }
      }, true);

      // Clique em uma bolinha: vai direto para a foto correspondente
      paginationEl.addEventListener("click", (e) => {
        const bullet = e.target.closest(".swiper-pagination-bullet");
        if (!bullet || !swiperInstance) return;
        const idx = parseInt(bullet.dataset.idx, 10);
        if (!isNaN(idx)) goToPhoto(idx);
      });

      // Previne o scroll da página ao usar o mousewheel em cima da paginação
      paginationEl.addEventListener("wheel", (e) => {
        e.preventDefault();
        e.stopPropagation();
      }, { passive: false });
    }

    function renderSlides(photos, copies) {
      const container = document.getElementById("swiperSlidesContainer");
      container.innerHTML = "";

      for (let c = 0; c < copies; c++) {
        photos.forEach((photo, idx) => {
          const slideIdx = c * photos.length + idx;
          const slide = document.createElement("div");
          
          // Determine classes and badges
          let isOldMon = photo.carousel_type === 'monitoramento_old';
          let isNewMon = photo.carousel_type === 'monitoramento_new';
          
          let borderClass = "";
          let badgeNc = "";
          
          if (isOldMon) {
             if (photo.is_nc) {
                borderClass = ' is-finished-border';
                const checkIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px;"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
                badgeNc = `<div class="slide-badge-nc is-finished" style="padding: 6px 7px; border-radius: 50%; right: 12px;">${checkIcon}</div>`;
             }
          } else if (isNewMon) {
             // For new photos in monitoring, do not show NC or PA
             badgeNc = "";
             borderClass = "";
          } else {
             // Normal
             borderClass = photo.is_nc ? ' is-nc' : "";
             if (photo.is_nc) {
                const svgIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width: 12px; height: 12px; margin-right: 1px;"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
                badgeNc = `<div class="slide-badge-nc">${svgIcon} ${photo.badge_text || 'NC'}</div>`;
             }
          }
          
          slide.className = "swiper-slide" + borderClass;

          const badgeCounter = `<div class="slide-badge-counter">${idx + 1} / ${photos.length}</div>`;

          slide.innerHTML = `
            <div class="slide-img-container">
              ${badgeCounter}
              ${badgeNc}
              <img src="${photo.src}" class="slide-img" alt="${photo.name}" loading="lazy" />
              <div class="slide-overlay">
                <span class="slide-title" title="${photo.name}">${photo.name}</span>
              </div>
            </div>
          `;

          // Clique em qualquer foto (inclusive cópias do loop) desliza até ela
          slide.addEventListener("click", () => {
            if (swiperInstance && !isDestroying && getSlideIndex() !== slideIdx) {
              swiperInstance.slideToLoop(slideIdx);
            }
          });

          container.appendChild(slide);
        });
      }
    }

    function destroySwiper() {
      if (!swiperInstance) return;
      isDestroying = true;
      try {
        swiperInstance.destroy(true, true);
      } catch (_) {
        // Silencia erros de limpeza em elementos já removidos do DOM
      }
      swiperInstance = null;
      isDestroying = false;
    }

    function initOrUpdateSwiper(photos, activeIndex, direction, hideLabels) {
      const carouselWrapper = document.getElementById("carouselWrapper");
      if (hideLabels) {
        carouselWrapper.classList.add("hide-labels");
      } else {
        carouselWrapper.classList.remove("hide-labels");
      }
      if (direction === "vertical") {
        carouselWrapper.classList.add("is-vertical");
      } else {
        carouselWrapper.classList.remove("is-vertical");
      }

      // Hash inclui a quantidade de fotos para detecção confiável de mudanças
      const photosHash = photos.length + ":" + photos.map(p => p.name + "_" + (p.is_nc ? "1" : "0")).join("|") + "_" + direction + "_" + hideLabels;
      const slidesChanged = photosHash !== currentPhotosHash;

      if (slidesChanged || !swiperInstance) {
        currentPhotosHash = photosHash;

        // IMPORTANTE: Destruir o Swiper ANTES de trocar o DOM para evitar
        // referências órfãs a elementos que serão removidos pelo renderSlides
        destroySwiper();

        // Loop infinito visual: replica as fotos até haver slides suficientes para que
        // sempre exista uma foto antes e depois da central (… 5 1 2 3 4 5 1 …).
        const useLoop = photos.length >= 2;
        const copies = useLoop ? Math.max(1, Math.ceil(MIN_LOOP_SLIDES / photos.length)) : 1;
        photoCount = photos.length;
        slideCount = photos.length * copies;
        renderSlides(photos, copies);

        const isVert = direction === "vertical";
        
        swiperInstance = new Swiper("#mySwiper", {
          direction: isVert ? "vertical" : "horizontal",
          effect: "coverflow",
          loop: useLoop,
          loopAdditionalSlides: useLoop ? 2 : 0,
          grabCursor: true,
          centeredSlides: true,
          slidesPerView: "auto",
          initialSlide: activeIndex,
          speed: 500,
          touchRatio: 0.9,
          resistanceRatio: 0.85,
          slideToClickedSlide: false, // tratado pelo handler de clique próprio (compatível com loop)
          watchSlidesProgress: true,
          keyboard: {
            enabled: true,
            onlyInViewport: true,
          },
          freeMode: {
            enabled: true,
            sticky: true,
            momentumRatio: 0.8,
            momentumVelocityRatio: 0.8,
          },
          mousewheel: {
            forceToAxis: true,
            sensitivity: 1.5,
            releaseOnEdges: false,
            eventsTarget: '.swiper-pagination',
          },
          coverflowEffect: {
            rotate: isVert ? -15 : 0,
            stretch: 0,
            depth: 130,
            modifier: 1.25,
            scale: 0.86,
            slideShadows: false,
          },
          navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev",
          },
          // Paginação do Swiper desativada: as bolinhas são renderizadas por renderDots()
          // para representar apenas as fotos reais (e não as cópias do loop).
          on: {
            realIndexChange: function () {
              renderDots();
              // Reporta imediatamente a mudança (mesmo durante animação) para
              // garantir que o Python veja a foto atual se o usuário clicar rápido em algum botão
              if (isInternalUpdate || isDestroying || !swiperInstance) return;
              if (isScrubbing) return;
              reportActiveIndex();
            },
            slideChangeTransitionEnd: function () {
              // Reseta a flag de atualização interna ao fim da transição
              if (isInternalUpdate || isDestroying || !swiperInstance) {
                isInternalUpdate = false;
                return;
              }
            }
          }
        });

        setupPaginationScrub();
        renderDots();

        lastReportedIndex = activeIndex;
        Streamlit.setComponentValue(activeIndex);
      } else {
        // As fotos continuam as mesmas, apenas sincroniza a posição do slide se necessário
        if (!isScrubbing && swiperInstance && getRealIndex() !== activeIndex) {
          isInternalUpdate = true;
          lastReportedIndex = activeIndex;
          goToPhoto(activeIndex, swiperInstance.params.speed || 500);
          Streamlit.setComponentValue(activeIndex);
        }
      }

      // Notifica o iframe para ajustar a altura exata
      setTimeout(() => {
        const height = document.getElementById("carouselWrapper").offsetHeight + 10;
        Streamlit.setFrameHeight(height > 0 ? height : 340);
      }, 50);
    }

    // Escuta eventos vindos do Streamlit Python
    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "streamlit:render") {
        const args = event.data.args || {};
        const photos = args.photos || [];
        const activeIndex = typeof args.currentIndex === "number" ? args.currentIndex : 0;
        const direction = args.direction || "horizontal";
        const hideLabels = args.hideLabels || false;

        if (photos.length > 0) {
          initOrUpdateSwiper(photos, activeIndex, direction, hideLabels);
        }
      }
    });

    // Notifica que o componente está pronto para receber dados
    Streamlit.setComponentReady();
  </script>
</body>

</html>
