<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./static/swiper-bundle.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .carousel-wrapper {
      position: relative;
      width: 100%;
      max-width: 860px;
      padding: 10px 0 32px 0;
    }

    .swiper {
      width: 100%;
      padding-top: 14px;
      padding-bottom: 28px;
      overflow: visible !important;
    }

    /* Fix: Força o hit-testing correto em efeito coverflow 3D.
       Sem isto, o translate3d(depth) faz cliques nos slides adjacentes
       serem interceptados pelo slide ativo na camada 3D do navegador. */
    .swiper-wrapper {
      pointer-events: none;
    }

    .swiper-slide {
      background-position: center;
      background-size: cover;
      width: 380px;
      max-width: 78vw;
      height: 270px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.08);
      transition: opacity 0.7s cubic-bezier(0.25, 1, 0.5, 1), filter 0.7s cubic-bezier(0.25, 1, 0.5, 1), transform 0.7s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.7s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.7s cubic-bezier(0.25, 1, 0.5, 1);
      border: 2px solid rgba(255, 255, 255, 0.6);
      cursor: grab;
      background-color: #1e293b;
      pointer-events: auto;
    }

    .swiper-slide:not(.swiper-slide-active) {
      cursor: pointer !important;
      opacity: 0.52;
      filter: blur(0.4px) grayscale(15%);
    }

    .swiper-slide:not(.swiper-slide-active):hover {
      opacity: 0.82;
      filter: none;
    }

    .swiper-slide:active {
      cursor: grabbing;
    }

    .swiper-slide-active {
      opacity: 1;
      filter: none;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.22), 0 4px 12px rgba(0, 0, 0, 0.1);
      border-color: #3b82f6;
    }

    .swiper-slide-active.is-nc {
      border-color: #ef4444 !important;
      box-shadow: 0 16px 36px rgba(239, 68, 68, 0.25), 0 4px 12px rgba(0, 0, 0, 0.1);
    }

    .slide-img-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background-color: #0f172a;
    }

    .slide-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      transition: transform 0.4s ease;
    }

    .swiper-slide-active:hover .slide-img {
      transform: scale(1.03);
    }

    /* Overlay com Gradiente para a Legenda */
    .slide-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px 14px 10px 14px;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.88) 0%, rgba(15, 23, 42, 0.5) 60%, transparent 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 3px;
      pointer-events: none;
    }

    .slide-title {
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      letter-spacing: 0.2px;
    }

    .slide-badge-nc {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(239, 68, 68, 0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      z-index: 10;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .slide-badge-counter {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 20px;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Custom Navigation Buttons */
    .swiper-button-prev,
    .swiper-button-next {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 50%;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
      color: #1e293b;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .swiper-button-prev:after,
    .swiper-button-next:after {
      font-size: 16px;
      font-weight: 800;
    }

    .swiper-button-prev:hover,
    .swiper-button-next:hover {
      background: #ffffff;
      transform: scale(1.1);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
      color: #2563eb;
    }

    .swiper-button-prev {
      left: 10px;
    }

    .swiper-button-next {
      right: 10px;
    }

    /* Custom Pagination Bullets */
    .swiper-pagination {
      bottom: 0px !important;
    }

    .swiper-pagination-bullet {
      width: 7px;
      height: 7px;
      background: #94a3b8;
      opacity: 0.45;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .swiper-pagination-bullet-active {
      width: 22px;
      border-radius: 5px;
      background: #3b82f6;
      opacity: 1;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.5);
    }

    /* Dark Mode Adjustments */
    @media (prefers-color-scheme: dark) {
      .swiper-slide {
        border-color: rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      }

      .swiper-button-prev,
      .swiper-button-next {
        background: rgba(30, 41, 59, 0.85);
        color: #f1f5f9;
        border-color: rgba(255, 255, 255, 0.12);
      }

      .swiper-button-prev:hover,
      .swiper-button-next:hover {
        background: #334155;
        color: #60a5fa;
      }
    }
  </style>
</head>

<body>
  <div class="carousel-wrapper" id="carouselWrapper">
    <div class="swiper" id="mySwiper">
      <div class="swiper-wrapper" id="swiperSlidesContainer">
        <!-- Slides gerados dinamicamente via Streamlit -->
      </div>
      <!-- Botões de navegação -->
      <div class="swiper-button-prev" title="Foto anterior"></div>
      <div class="swiper-button-next" title="Próxima foto"></div>
      <!-- Paginação moderna -->
      <div class="swiper-pagination"></div>
    </div>
  </div>

  <script src="./static/swiper-bundle.min.js"></script>
  <script>
    // Bridge de comunicação nativo do Streamlit Component
    const Streamlit = {
      setComponentReady: function () {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:componentReady",
          apiVersion: 1
        }, "*");
      },
      setFrameHeight: function (height) {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:setFrameHeight",
          height: height
        }, "*");
      },
      setComponentValue: function (value) {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:setComponentValue",
          value: value
        }, "*");
      }
    };

    let swiperInstance = null;
    let currentPhotosHash = "";
    let isInternalUpdate = false;
    let lastReportedIndex = -1;
    let isDestroying = false;

    function renderSlides(photos, activeIndex) {
      const container = document.getElementById("swiperSlidesContainer");
      container.innerHTML = "";

      photos.forEach((photo, idx) => {
        const slide = document.createElement("div");
        slide.className = "swiper-slide" + (photo.is_nc ? " is-nc" : "");

        const badgeCounter = `<div class="slide-badge-counter">${idx + 1} / ${photos.length}</div>`;
        const badgeNc = photo.is_nc ? `<div class="slide-badge-nc">⚠️ Em NC</div>` : "";

        slide.innerHTML = `
          <div class="slide-img-container">
            ${badgeCounter}
            ${badgeNc}
            <img src="${photo.src}" class="slide-img" alt="${photo.name}" loading="lazy" />
            <div class="slide-overlay">
              <span class="slide-title" title="${photo.name}">${photo.name}</span>
            </div>
          </div>
        `;

        // Garante que o clique em qualquer foto (inclusive 1, 2 e 3) deslize para ela diretamente
        slide.addEventListener("click", () => {
          if (swiperInstance && !isDestroying && swiperInstance.activeIndex !== idx) {
            swiperInstance.slideTo(idx);
          }
        });

        container.appendChild(slide);
      });
    }

    function destroySwiper() {
      if (!swiperInstance) return;
      isDestroying = true;
      try {
        swiperInstance.destroy(true, true);
      } catch (_) {
        // Silencia erros de limpeza em elementos já removidos do DOM
      }
      swiperInstance = null;
      isDestroying = false;
    }

    function initOrUpdateSwiper(photos, activeIndex) {
      // Hash inclui a quantidade de fotos para detecção confiável de mudanças
      const photosHash = photos.length + ":" + photos.map(p => p.name + "_" + (p.is_nc ? "1" : "0")).join("|");
      const slidesChanged = photosHash !== currentPhotosHash;

      if (slidesChanged || !swiperInstance) {
        currentPhotosHash = photosHash;

        // IMPORTANTE: Destruir o Swiper ANTES de trocar o DOM para evitar
        // referências órfãs a elementos que serão removidos pelo renderSlides
        destroySwiper();
        renderSlides(photos, activeIndex);

        swiperInstance = new Swiper("#mySwiper", {
          effect: "coverflow",
          grabCursor: true,
          centeredSlides: true,
          slidesPerView: "auto",
          initialSlide: activeIndex,
          speed: 500,
          touchRatio: 0.9,
          resistanceRatio: 0.85,
          slideToClickedSlide: true,
          watchSlidesProgress: true,
          keyboard: {
            enabled: true,
            onlyInViewport: true,
          },
          mousewheel: {
            forceToAxis: true,
            thresholdDelta: 50,
          },
          coverflowEffect: {
            rotate: 0,
            stretch: 0,
            depth: 130,
            modifier: 1.25,
            scale: 0.86,
            slideShadows: false,
          },
          navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev",
          },
          pagination: {
            el: ".swiper-pagination",
            clickable: true,
            dynamicBullets: true,
          },
          on: {
            slideChangeTransitionEnd: function () {
              // Não reporta durante destruição ou recriação do Swiper
              if (isInternalUpdate || isDestroying || !swiperInstance) {
                isInternalUpdate = false;
                return;
              }
              const newIndex = swiperInstance.activeIndex;
              if (newIndex !== lastReportedIndex) {
                lastReportedIndex = newIndex;
                Streamlit.setComponentValue(newIndex);
              }
            }
          }
        });

        lastReportedIndex = activeIndex;
      } else {
        // As fotos continuam as mesmas, apenas sincroniza a posição do slide se necessário
        if (swiperInstance && swiperInstance.activeIndex !== activeIndex) {
          isInternalUpdate = true;
          lastReportedIndex = activeIndex;
          swiperInstance.slideTo(activeIndex, swiperInstance.params.speed || 500);
        }
      }

      // Notifica o iframe para ajustar a altura exata
      setTimeout(() => {
        const height = document.getElementById("carouselWrapper").offsetHeight + 10;
        Streamlit.setFrameHeight(height > 0 ? height : 340);
      }, 50);
    }

    // Escuta eventos vindos do Streamlit Python
    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "streamlit:render") {
        const args = event.data.args || {};
        const photos = args.photos || [];
        const activeIndex = typeof args.currentIndex === "number" ? args.currentIndex : 0;

        if (photos.length > 0) {
          initOrUpdateSwiper(photos, activeIndex);
        }
      }
    });

    // Notifica que o componente está pronto para receber dados
    Streamlit.setComponentReady();
  </script>
</body>

</html>
